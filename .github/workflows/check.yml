name: linebot-family 班級網站推播

on:
  schedule:
    # UTC 時間，對應台灣時間 (UTC+8) 15:00 與 18:30
    - cron: '23 8 * * *'
    - cron: '21 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          RAW_BASE_URL: ${{ secrets.RAW_BASE_URL }}
          TZ: Asia/Taipei
        run: python main.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json images/
          git diff --cached --quiet || (git commit -m "chore: update state and images" && git push)
